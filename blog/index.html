    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #C6A25A;
            --gold-light: #D4B876;
            --gold-dim: rgba(198, 162, 90, 0.12);
            --dark: #0A0F1A;
            --dark-card: #111827;
            --dark-elevated: #1A2236;

        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--dark); color: var(--text); line-height: 1.7; }

        h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; color: var(--cream); font-weight: 500; }
        a { color: var(--gold); text-decoration: none; transition: color 0.3s; }
        a:hover { color: var(--gold-light); }

        /* Header */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(10, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem; max-width: 1240px; margin: 0 auto;
        }
        .logo img { height: 38px; }
        .nav-links { list-style: none; display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--text); font-size: 0.85rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
        .nav-links a:hover { color: var(--cream); }

        /* Language Toggle */
        .lang-toggle { display: flex; gap: 0.25rem; margin-left: 1rem; }
        .lang-btn {
            background: transparent; border: 1px solid var(--border); color: var(--muted);
            padding: 0.25rem 0.6rem; font-size: 0.7rem; font-weight: 600; cursor: pointer;
            letter-spacing: 0.05em; transition: all 0.3s;
        }
        .lang-btn:hover { border-color: var(--gold); color: var(--cream); }
        .lang-btn.active { background: var(--gold); color: var(--dark); border-color: var(--gold); }

        /* Blog Container */
        .blog-container {
            max-width: 1000px; margin: 0 auto; padding: 8rem 2rem 5rem;
        }
        .blog-header {
            margin-bottom: 4rem;
        }
        .blog-title {
            font-size: clamp(2.5rem, 5vw, 3.5rem); margin-bottom: 1rem;
        }
        .blog-subtitle {
            font-size: 1.1rem; color: var(--text); line-height: 1.65;
        }

        /* Article Grid */
        .article-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem; margin-top: 2rem;
        }
        .article-card {
            display: block; background: var(--dark-card); border: 1px solid var(--border);
            padding: 2rem; transition: all 0.4s var(--ease);
            text-decoration: none; color: inherit;
        }
        .article-card:hover {
            border-color: var(--border-hover); background: var(--dark-elevated);
        }
        .article-meta {
            font-size: 0.75rem; color: var(--gold); text-transform: uppercase;
            letter-spacing: 0.1em; margin-bottom: 0.8rem; font-weight: 600;
        }
        .article-card-content {
            display: flex; flex-direction: column;
        }
        .article-title {
            font-size: 1.35rem; line-height: 1.25; margin-bottom: 1rem;
        }
        .article-date {
            margin-top: auto; font-size: 0.85rem; color: var(--muted);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border); padding: 3rem 2rem; margin-top: 5rem;
            text-align: center; font-size: 0.85rem; color: var(--muted);
        }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .blog-container { padding: 6rem 1.2rem 3rem; }
            .article-grid { grid-template-columns: 1fr; }
            .nav-links { display: none; }
        }
